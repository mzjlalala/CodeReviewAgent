# 应用服务 WEB 访问端口
server:
  port: 8080


gitlab:
  base-url: https://git.pc.com.cn
  private-token: hh8qNTCLD8-HwGyAaF6g
  webhook-secret: 123456

# 大模型配置：修改 active-provider 切换厂商，重启生效
llm:
  active-provider: deepseek
  providers:
    deepseek:
      base-url: https://api.deepseek.com/v1
      api-key: ${DEEPSEEK_API_KEY:11}
      model: deepseek-chat
      temperature: 0.3
      timeout-seconds: 120
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY:your-qwen-api-key}
      model: qwen-plus
      temperature: 0.3
      timeout-seconds: 120
    glm:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${GLM_API_KEY:your-glm-api-key}
      model: glm-4-flash
      temperature: 0.3
      timeout-seconds: 120

# AI 代码审查
code-review:
  enabled: true
  max-diff-chars: 80000

logging:
  level:
    cn:
      com:
        pcauto:
          service:
            serviceImpl:
              MergeRequestReviewServiceImpl: DEBUG