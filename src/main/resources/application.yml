# 应用服务 WEB 访问端口
server:
  port: 8080


gitlab:
  base-url: http://192.168.100.132:8088
  private-token: ${private-token}
  webhook-secret: ${webhook-secret}

# Spring AI 配置（当前厂商：deepseek，兼容 OpenAI Chat API 格式）
# 如需切换厂商，修改 base-url / api-key / model 三项：
#   通义千问: base-url=https://dashscope.aliyuncs.com/compatible-mode/v1  model=qwen-plus
#   智谱 GLM: base-url=https://open.bigmodel.cn/api/paas/v4              model=glm-4-flash
spring:
  ai:
    openai:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      connection-timeout: 10s
      read-timeout: 120s
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3

# AI 代码审查
code-review:
  enabled: true
  max-diff-chars: 80000

logging:
  level:
    com.maa.agent: DEBUG      # Agent 推理过程（🤔思考 / 🔧工具 / 📝输出）
    com.maa.service: INFO     # 业务编排日志